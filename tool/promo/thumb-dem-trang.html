<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=block" rel="stylesheet">
<style>
@font-face{font-family:BVP;src:url(BeVietnamPro-ExtraBold.ttf);font-weight:800}
@font-face{font-family:BVP;src:url(BeVietnamPro-Bold.ttf);font-weight:700}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;position:relative;background:#0b1630;font-family:BVP}
.bg{position:absolute;inset:0;background:url(bg.png) no-repeat;background-size:1400px auto;background-position:-40px -190px;filter:brightness(.8) saturate(.95) hue-rotate(-6deg)}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,60,.6) 0%,rgba(10,20,60,.05) 40%,rgba(5,10,30,.3) 100%)}
.left{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,14,38,.97) 0%,rgba(7,14,38,.9) 33%,rgba(7,14,38,.5) 48%,rgba(7,14,38,0) 62%)}
.moon{position:absolute;left:560px;top:28px;width:150px;height:150px;border-radius:50%;
 background:radial-gradient(circle at 40% 38%,#fffbe6 0%,#fff3c2 45%,#f3dc8a 100%);
 box-shadow:0 0 40px 14px rgba(255,236,170,.55),0 0 120px 60px rgba(255,226,140,.25)}
.moon i{position:absolute;border-radius:50%;background:rgba(214,190,120,.35)}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.6)}
.ff{position:absolute;width:7px;height:7px;border-radius:50%;background:#f4ff9c;box-shadow:0 0 10px 5px rgba(220,255,110,.75),0 0 26px 12px rgba(200,255,90,.3)}
.icon{position:absolute;left:52px;top:62px;width:120px;height:120px;border-radius:26px;border:4px solid #ffd76a;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 30px rgba(255,215,106,.35)}
h1{position:absolute;left:46px;top:186px;font-family:'Baloo 2',BVP;font-weight:800;font-size:128px;line-height:.98;color:#ffe9a8;
 text-shadow:0 5px 0 #a8742a,0 0 34px rgba(255,214,120,.55),0 10px 30px rgba(0,0,0,.6)}
.sub{position:absolute;left:52px;top:476px;font-weight:800;font-size:42px;line-height:1.25;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.8)}
.sub b{color:#d9ff7a}
.badge{position:absolute;left:52px;top:598px;padding:14px 30px;border-radius:40px;background:linear-gradient(#ffd25a,#f0a92a);color:#3b2206;
 font-weight:800;font-size:34px;box-shadow:0 6px 0 #9c5d10,0 10px 26px rgba(0,0,0,.5)}
.phone{position:absolute;right:56px;top:28px;width:372px;height:662px;border-radius:44px;background:#151515;padding:12px;transform:rotate(3deg);
 box-shadow:0 0 0 5px #f4e2b0,0 20px 50px rgba(0,0,0,.7),0 0 60px rgba(255,230,150,.25)}
.phone div{width:100%;height:100%;border-radius:34px;background:url(phone.png) center/cover}
</style></head><body>
<div class="bg"></div><div class="tint"></div><div style="position:absolute;left:380px;top:-120px;width:620px;height:520px;background:radial-gradient(closest-side,rgba(255,236,170,.22),rgba(255,236,170,0))"></div>
<div id="fx"></div>
<div class="moon"><i style="left:38px;top:44px;width:30px;height:26px"></i><i style="left:86px;top:80px;width:22px;height:20px"></i><i style="left:60px;top:100px;width:14px;height:12px"></i></div>
<div class="left"></div>
<img class="icon" src="icon-512.png">
<h1>Mùa Lúa<br>Chín</h1>
<div class="sub">Đêm trăng làng quê<br><b>Đom đóm lập lòe</b> ✨</div>
<div class="badge">🌕 MỚI: ĐÊM TRĂNG RẰM</div>
<div class="phone"><div></div></div>
<script>
const fx=document.getElementById('fx');let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;
for(let i=0;i<55;i++){const e=document.createElement('div');e.className='star';e.style.left=(430+r()*560)+'px';e.style.top=(r()*230)+'px';e.style.opacity=.35+r()*.6;fx.appendChild(e)}
for(let i=0;i<22;i++){const e=document.createElement('div');e.className='ff';e.style.left=(470+r()*420)+'px';e.style.top=(260+r()*430)+'px';const k=.5+r()*.8;e.style.transform=`scale(${k})`;fx.appendChild(e)}
</script></body></html>
